# Requests AMD hardware validation manually or through a /ci-rocm PR comment.
name: ROCm Hardware CI
run-name: "ROCm HW CI [origin:${{ inputs.original_run_id || github.run_id }}]"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: 'Benchmark names or --name/--tag filters to run'
        required: true
      architectures:
        description: 'Comma-separated GPU architectures to test'
        required: true
      amd_ref:
        description: 'AMD-AGI branch or release tag used as the image build context'
        required: false
        default: 'main'
      original_run_id:
        description: 'Automatic retry only; leave empty'
        required: false
        default: ''
      continuation_count:
        description: 'Automatic retry only; leave empty'
        required: false
        default: ''
      pr_number:
        description: 'Automatic retry only; PR receiving the final result'
        required: false
        default: ''

env:
  PARTNER_REPO: AMD-AGI/diffusion-models-inference
  PARTNER_WORKFLOW: xdit-hardware-compat.yml

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  wait:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == '/ci-rocm' ||
        startsWith(github.event.comment.body, '/ci-rocm ')))
    runs-on: ubuntu-latest
    # Five minutes under the hosted-runner limit; this job may automatically retry up to 3 times.
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      SELF_WORKFLOW: rocm-hardware-ci.yml
      ORIGINAL_RUN_ID: ${{ inputs.original_run_id || github.run_id }}
      CONTINUATION_COUNT: ${{ inputs.original_run_id && inputs.continuation_count || '0' }}
      BENCHMARKS: ${{ inputs.benchmarks }}
      ARCHITECTURES: ${{ inputs.architectures }}
      AMD_REF: ${{ inputs.amd_ref }}
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
    steps:
      - name: Checkout trusted comment parser
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read comment request
        if: github.event_name == 'issue_comment'
        run: |
          python3 .github/scripts/rocm_ci_request.py

      - name: Resolve PR commit
        if: github.event_name == 'issue_comment'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if [[ $(printf '%s' "$pr" | jq -r '.state') != open ]]; then
            echo "::error::ROCm CI requires an open pull request."
            exit 1
          fi
          sha=$(printf '%s' "$pr" | jq -r '.head.sha')
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::PR head SHA is missing or invalid."
            exit 1
          fi
          echo "XDIT_SHA=${sha}" >> "$GITHUB_ENV"

      - name: Validate request
        id: request
        run: |
          set -euo pipefail

          if [[ ! "$ORIGINAL_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid original run ID: ${ORIGINAL_RUN_ID}"
            exit 1
          fi
          if [[ ! "$CONTINUATION_COUNT" =~ ^[0-9]+$ ]] || [ "$CONTINUATION_COUNT" -gt 3 ]; then
            echo "::error::Invalid continuation count: ${CONTINUATION_COUNT}"
            exit 1
          fi
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          if [[ -z "$BENCHMARKS" || "$BENCHMARKS" == *$'\n'* || "$BENCHMARKS" == *$'\r'* ]]; then
            echo "::error::Benchmarks must be a non-empty single-line value."
            exit 1
          fi
          if [[ -z "$ARCHITECTURES" || "$ARCHITECTURES" == *$'\n'* || "$ARCHITECTURES" == *$'\r'* ]]; then
            echo "::error::Architectures must be a non-empty single-line value."
            exit 1
          fi
          if [[ ! "$AMD_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] ||
             ! git check-ref-format "refs/heads/${AMD_REF}" >/dev/null 2>&1; then
            echo "::error::Invalid AMD ref: '${AMD_REF}'"
            exit 1
          fi

          echo "WAIT_DEADLINE=$(( $(date +%s) + 21000 ))" >> "$GITHUB_ENV"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge command
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes

      - name: Publish request metadata
        if: github.event_name == 'issue_comment' || inputs.original_run_id == ''
        run: |
          mkdir -p request
          jq -n \
            --arg benchmarks "$BENCHMARKS" \
            --arg architectures "$ARCHITECTURES" \
            --arg amd_ref "$AMD_REF" \
            --arg xdit_sha "${XDIT_SHA:-$GITHUB_SHA}" \
            '{benchmarks: $benchmarks, architectures: $architectures, amd_ref: $amd_ref, xdit_sha: $xdit_sha}' > request/request.json

      - name: Upload request metadata
        if: github.event_name == 'issue_comment' || inputs.original_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: rocm-hardware-request
          path: request/request.json
          retention-days: 2
          overwrite: true

      - name: Preflight — confirm cross-repo read access
        run: |
          if ! gh api "repos/${PARTNER_REPO}/actions/workflows/${PARTNER_WORKFLOW}/runs?per_page=1" >/dev/null 2>&1; then
            echo "::error::Cannot read ${PARTNER_REPO} Actions API. Verify that ${PARTNER_REPO} is still public and has the corresponding workflow."
            exit 1
          fi

      - name: Wait for the hardware run
        id: wait
        run: |
          set -euo pipefail
          marker="[xdit-run:${ORIGINAL_RUN_ID}]"
          api_failures=0

          while [ "$(date +%s)" -lt "$WAIT_DEADLINE" ]; do
            if ! runs=$(gh api "repos/${PARTNER_REPO}/actions/workflows/${PARTNER_WORKFLOW}/runs?per_page=100"); then
              api_failures=$(( api_failures + 1 ))
              echo "::warning::Partner Actions API request failed (${api_failures}/5)."
              if [ "$api_failures" -ge 5 ]; then
                echo "::error::Partner Actions API failed 5 consecutive times."
                exit 1
              fi
              sleep 60
              continue
            fi
            api_failures=0
            run=$(printf '%s' "$runs" | jq -c --arg m "$marker" \
              '[.workflow_runs[] | select((.display_title // "") | contains($m))] | first // empty')

            if [ -n "$run" ]; then
              status=$(echo "$run" | jq -r '.status')
              url=$(echo "$run" | jq -r '.html_url')
              echo "hardware_url=${url}" >> "$GITHUB_OUTPUT"
              if [ "$status" = "completed" ]; then
                conclusion=$(echo "$run" | jq -r '.conclusion')
                {
                  echo "### ROCm hardware CI: ${conclusion}"
                  echo ""
                  echo "[Full run details](${url})"
                } >> "$GITHUB_STEP_SUMMARY"
                echo "concluded: ${conclusion} (${url})"
                [ "$conclusion" = "success" ] && exit 0 || exit 1
              fi
              echo "hardware run ${status}: ${url}"
            fi
            sleep 60
          done

          if [ "$CONTINUATION_COUNT" -ge 3 ]; then
            echo "::error::Hardware run did not complete after 3 automatic retries."
            exit 1
          fi
          next_continuation=$(( CONTINUATION_COUNT + 1 ))

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${SELF_WORKFLOW}/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f 'inputs[benchmarks]='"$BENCHMARKS" \
            -f 'inputs[architectures]='"$ARCHITECTURES" \
            -f 'inputs[amd_ref]='"$AMD_REF" \
            -f 'inputs[original_run_id]='"$ORIGINAL_RUN_ID" \
            -f 'inputs[continuation_count]='"$next_continuation" \
            -f 'inputs[pr_number]='"$PR_NUMBER"
          echo "continued=true" >> "$GITHUB_OUTPUT"
          echo "retrying original run ${ORIGINAL_RUN_ID} (${next_continuation}/3)"

      - name: Comment final result on PR
        if: >-
          always() && !cancelled() &&
          steps.request.outputs.pr_number != '' &&
          steps.wait.outputs.continued != 'true'
        env:
          RESULT_PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          HARDWARE_URL: ${{ steps.wait.outputs.hardware_url }}
        run: |
          result=failed
          if [[ "$WAIT_OUTCOME" == success ]]; then
            result=completed
          fi
          url=${HARDWARE_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${RESULT_PR_NUMBER}/comments" \
            -f body="CI run ${result}, ${url}"
