[pytest]
testpaths =
    tests/unit
    tests/integration/cpu
log_format = %(asctime)s %(filename)s:%(lineno)d %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
addopts = --color=auto --strict-markers
markers =
    accelerator: requires a CUDA-, ROCm-, or other accelerator-backed runtime
    nvidia: requires an NVIDIA CUDA runtime
    rocm: requires an AMD ROCm runtime
    multi_gpu: requires more than one accelerator
    gloo: spawns multiple ranks over Gloo on CPU; no accelerator required
    network: accesses an external network service or downloads model data
    slow: takes seconds rather than milliseconds (e.g. spawns a fresh interpreter)
    e2e: runs a complete model or pipeline workflow
