[pytest]
# Add the repository root to Python's import path. The tests/__init__.py files make the repository
# tests a regular package, which takes precedence over unrelated installed packages named tests.
pythonpath = .
log_format = %(asctime)s %(filename)s:%(lineno)d %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli = true
log_level = INFO
addopts = --capture=tee-sys --verbose --color=auto --durations=0